name: Baidu - sync official stable release

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baidu-stable-sync
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.repository == 'iurni/sing-box' && github.ref == 'refs/heads/codex/baidu'
    uses: ./.github/workflows/baidu-apps.yml
    permissions:
      contents: write
      actions: read
    with:
      sync: true
      publish_release: true
    secrets: inherit
