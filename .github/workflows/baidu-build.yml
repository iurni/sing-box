name: Baidu - test and build

on:
  push:
    branches: [codex/baidu]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'release/**'
      - 'tools/baidu-*'
      - '.github/baidu-*'
      - '.github/workflows/baidu-*.yml'
  pull_request:
    branches: [codex/baidu]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baidu-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'iurni/sing-box'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from this checkout
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install loopback test and packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcpdump zip

      - name: Run all gates and build the Windows and Android cores
        run: node tools/baidu-build.mjs

      - name: Upload source-built packages and checksums
        uses: actions/upload-artifact@v4
        with:
          name: baidu-build-${{ github.sha }}
          path: dist/baidu-packages/*
          if-no-files-found: error
          retention-days: 30
