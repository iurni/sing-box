name: Baidu - test and build apps

on:
  push:
    branches: [codex/baidu]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'release/**'
      - 'clients/**'
      - '.gitmodules'
      - 'tools/baidu-*'
      - '.github/baidu-*'
      - '.github/workflows/baidu-*.yml'
  pull_request:
    branches: [codex/baidu]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Build and verify both signed apps, then publish from the default branch'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: baidu-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    if: github.repository == 'iurni/sing-box'
    uses: ./.github/workflows/baidu-apps.yml
    permissions:
      contents: write
      actions: read
    with:
      sync: false
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    secrets: inherit
